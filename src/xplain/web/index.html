<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xPlain Live Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="viewport">
<main id="stage" aria-label="xPlain Live studio screen">

  <!-- score bug -->
  <div class="scorebug" id="scorebug">
    <span class="code" id="home-code">&nbsp;</span>
    <span class="score" id="score">&nbsp;</span>
    <span class="code" id="away-code">&nbsp;</span>
    <span class="divider" aria-hidden="true"></span>
    <span class="minute"><span class="live-dot" aria-hidden="true"></span><span id="minute">&nbsp;</span></span>
    <span class="half" id="half"></span>
  </div>

  <!-- product mark + modes -->
  <div class="topright">
    <div class="mark">xPlain <span>Live</span></div>
    <div class="seg" role="group" aria-label="Mode">
      <button type="button" class="on" aria-pressed="true">Studio</button>
      <button type="button" disabled aria-disabled="true" title="Coming soon">Analyst</button>
      <button type="button" disabled aria-disabled="true" title="Coming soon">Player</button>
    </div>
    <div class="seg lang" role="group" aria-label="Commentary language" id="lang">
      <button type="button" data-lang="en" class="on" aria-pressed="true">EN</button>
      <button type="button" data-lang="es" aria-pressed="false">ES</button>
      <button type="button" data-lang="el" aria-pressed="false">EL</button>
    </div>
  </div>

  <!-- title: its wording lives here only -->
  <h1 class="title">Pass outliers</h1>

  <!-- pitch, with the possession tab on its top edge -->
  <div class="pitch">
    <div class="possession" id="possession" role="status" hidden>
      <div class="tab" id="tab">
        <span class="tab-code" id="tab-code"></span>
        <svg class="chevrons" width="34" height="12" viewBox="0 0 34 12" aria-hidden="true">
          <path d="M2 1 L7 6 L2 11"></path><path d="M14 1 L19 6 L14 11"></path><path d="M26 1 L31 6 L26 11"></path>
        </svg>
      </div>
    </div>
    <div class="replaybar" id="replaybar" aria-live="polite">
      <span class="replay-badge" id="replay-badge"></span>
    </div>
    <svg viewBox="0 0 120 80" width="780" height="520" role="img" id="pitch-svg" aria-label="Pitch">
      <defs>
        <marker id="arrow-green" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#3BD16F"></path></marker>
      </defs>
      <rect x="0" y="0" width="120" height="80" fill="#10294A"></rect>
      <g fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="0.3">
        <rect x="0.15" y="0.15" width="119.7" height="79.7"></rect>
        <line x1="60" y1="0" x2="60" y2="80"></line>
        <circle cx="60" cy="40" r="10"></circle>
        <rect x="0" y="18" width="18" height="44"></rect>
        <rect x="0" y="30" width="6" height="20"></rect>
        <rect x="102" y="18" width="18" height="44"></rect>
        <rect x="114" y="30" width="6" height="20"></rect>
      </g>
      <g id="passes"></g>
    </svg>
  </div>

  <!-- half selector for the tables -->
  <div class="seg scope" role="group" aria-label="Moments from" id="scope">
    <button type="button" data-scope="all" class="on" aria-pressed="true">All</button>
    <button type="button" data-scope="1" aria-pressed="false">1st</button>
    <button type="button" data-scope="2" aria-pressed="false">2nd</button>
  </div>

  <!-- ranking tables -->
  <div class="tables">
    <section aria-labelledby="t-fail">
      <div class="thead"><h2 id="t-fail">Surprise failures</h2><div class="tsub">easy passes not completed</div></div>
      <div class="rows" id="rows-surprise_failure"></div>
    </section>
    <section aria-labelledby="t-succ">
      <div class="thead"><h2 id="t-succ">Surprise successes</h2><div class="tsub">hard passes completed</div></div>
      <div class="rows" id="rows-surprise_success"></div>
    </section>
    <div class="footnote">PVA: the result minus the chance the pass had (xP), in points. Longer bar, bigger surprise.</div>
  </div>

  <!-- lower third: name tab on top of a dark body -->
  <div class="lower waiting" id="lower" aria-live="polite">
    <div class="nametab" id="nametab">
      <span class="tab-name" id="lower-name"></span>
      <span class="tab-div" aria-hidden="true"></span>
      <span class="tab-when" id="lower-when"></span>
    </div>
    <div class="body">
      <div class="left">
        <div class="line" id="lower-line"></div>
        <div class="meta" id="lower-meta"></div>
      </div>
      <div class="right">
        <div class="pvanum" id="lower-pva">–</div>
        <div class="pvalabel">PVA</div>
      </div>
    </div>
  </div>

  <!-- controls -->
  <div class="controls">
    <div class="playrow">
      <button type="button" class="playbtn" id="play" aria-label="Pause">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" id="play-icon"></svg>
      </button>
      <div class="seg speed" role="group" aria-label="Playback speed" id="speed">
        <button type="button" data-speed="1" aria-pressed="false">1×</button>
        <button type="button" data-speed="12" class="on" aria-pressed="true">12×</button>
        <button type="button" data-speed="60" aria-pressed="false">60×</button>
      </div>
    </div>
    <button type="button" class="live" id="live"><span class="live-dot big" aria-hidden="true"></span>Back to live</button>
    <div class="steps">
      <button type="button" id="prev" aria-label="Previous pass"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
      <button type="button" id="next" aria-label="Next pass"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
    </div>
  </div>

  <div class="status" id="status" role="status" hidden></div>
</main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
